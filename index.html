<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Control de Gastos</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fuente de Google para que se vea bonito -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h2>Mis Finanzas</h2>

        <!-- Balance Principal -->
        <h4>Tu Balance</h4>
        <h1 id="balance">$0.00</h1>

        <!-- Resumen Ingresos vs Gastos -->
        <div class="inc-exp-container">
            <div>
                <h4>Ingresos</h4>
                <p id="money-plus" class="money plus">+$0.00</p>
            </div>
            <div>
                <h4>Gastos</h4>
                <p id="money-minus" class="money minus">-$0.00</p>
            </div>
        </div>

        <!-- Historial -->
        <h3>Historial</h3>
        <ul id="list" class="list">
            <!-- Aquí se agregarán las transacciones dinámicamente -->
        </ul>

        <!-- Formulario para agregar -->
        <h3>Agregar nueva transacción</h3>
        <form id="form">
            <div class="form-control">
                <label for="text">Concepto</label>
                <input type="text" id="text" placeholder="Ej. Sueldo, Café..." />
            </div>
            <div class="form-control">
                <label for="amount">Monto <br />
                <small>(negativo - para gastos, positivo para ingresos)</small></label>
                <input type="number" id="amount" placeholder="Ej. -20 o 500" />
            </div>
            <button class="btn">Agregar Transacción</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
